# AutoCover-Lite with paid models: the repository's config.yaml with only the `llm`
# section replaced. Run with `--config examples/config.paid.yaml`, and set
# ANTHROPIC_API_KEY (any LiteLLM provider works; mix providers so one outage does not
# stop a role).
#
# What changes compared with the free-tier config, and why:
# * Strongest models where one call matters most (Preparer, last repair attempt), a fast
#   strong model for the bulk roles, a small one for the many short judge calls.
# * No daily caps (`rpd`), reservations, `runs_per_day` or `role_queue_wait_s`: those
#   ration scarce free quotas. Paid tiers are limited by rate and cost instead.
# * Higher concurrency: round 1 fires one call per function in parallel.
# * Keep `run.max_llm_calls` below as the per-run cost cap; `autocover report` shows the
#   tokens each model used, to price a run.

llm:
  roles:
    preparer:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5
    generator:
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4-5-20251001
    fixer:
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4-5-20251001
    fixer_final:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5
    judge:
      - anthropic/claude-haiku-4-5-20251001
      - anthropic/claude-sonnet-5

  providers:
    anthropic: { rpm: null, max_concurrency: 8 }   # set from your account's rate limits

  max_queue_wait_s: 15
  temperature: 0.2
  timeout_s: 120
  retries: 3
  backoff_base_s: 1.0
  backoff_max_s: 30.0
  circuit_breaker:
    failure_threshold: 3
    cooldown_s: 120
  cache:
    enabled: true
    path: .autocover/llm_cache.sqlite
  usage_path: .autocover/usage.sqlite

sandbox:
  backend: docker        # docker | local (local = subprocess, for development only)
  python_version: "3.12"
  timeout_s: 45          # per candidate run (a batch gets 2x): unit tests take seconds,
                         # so 45s means a hang (iterutils: a test looping on an infinite
                         # iterator cost 120s three times at the old limit)
  memory: 1g
  cpus: 1.0
  pids_limit: 256
  max_parallel: 6        # concurrent sandboxes (1 CPU, 1g RAM each)
  workdir: null          # scratch dir for workspaces; null = system temp dir
  batch: true            # one sandbox runs many candidates; coverage is credited per test
  batch_size: 25

run:
  max_rounds: 3             # generate -> execute rounds; later rounds target what is still uncovered
  budget_min: 10
  max_scenarios_per_function: 6
  preparer_batch: 6         # functions planned per Preparer call (large modules)
  preparer_budget_share: 0.2  # planning never takes more than 20% of the budget
  max_functions_first_round: 60  # round 1: a breadth pass over every function
  max_functions_per_round: 12    # later rounds: the functions with the biggest gaps
  preparer_max_tokens: 4096
  generator_max_tokens: 8192
  include_private: false
  max_fix_attempts: 2       # Fixer attempts per test before it is frozen
  judge_scenarios: true     # a test with no new coverage/kills can still count for a new scenario
  max_llm_calls: 60         # per-run budget of non-cached LLM calls (free-tier friendly)
  max_llm_tokens: null
  flaky_reruns: 1           # re-run the final suite; a test failing in any rerun is dropped

mutation:
  enabled: true
  max_mutants_per_function: 8     # per-function pool (seeded sample)
  max_mutants_total: 150          # cap on the whole module's pool (seeded sample)
  max_mutants_per_candidate: 12   # mutants on lines a candidate executes, own function first
  final_score: true               # report the final suite's mutation score
  timeout_s: 30
  seed: 0

telemetry:
  jsonl_path: .autocover/telemetry.jsonl
  runs_dir: .autocover/runs  # one JSON summary per run (autocover report)
  otlp_endpoint: null    # or set OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://localhost:4318
