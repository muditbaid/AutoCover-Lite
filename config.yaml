# AutoCover-Lite configuration.
# Model ids are LiteLLM strings ("<provider>/<model>"). Free-tier model names change;
# confirm them with `autocover llm-ping --model <id>` and bench/model_bakeoff.py.

llm:
  # Fallback chain per agent role: first healthy model wins. Versions are pinned (no
  # "-latest" aliases): aliases move without notice, and free-tier quotas are metered per
  # model version, so a silent alias change would also change the limits.
  roles:
    generator:
      - nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      - mistral/codestral-2508
      - gemini/gemini-3.5-flash
      - gemini/gemini-2.5-flash       # separate 20/day quota from 3.5
    fixer:
      - nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      - mistral/codestral-2508
      - gemini/gemini-3.5-flash
      - gemini/gemini-2.5-flash
    preparer:                         # few calls per run, so reasoning quality matters most
      - nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      - gemini/gemini-3.5-flash
      - groq/openai/gpt-oss-120b
    judge:                            # many short calls: needs request/token headroom
      - groq/openai/gpt-oss-20b
      - mistral/ministral-14b-2512
      - gemini/gemini-3.5-flash-lite

  # Per-model quotas, set ~10% under what each provider reported for this account on
  # 2026-09-23 (rate-limit headers; Gemini from aistudio.google.com/rate-limit).
  # `autocover usage` shows today's counts.
  models:
    groq/openai/gpt-oss-20b: { rpm: 25, tpm: 7200, rpd: 950 }     # 1000/day, 8K TPM
    groq/openai/gpt-oss-120b: { rpm: 25, tpm: 7200, rpd: 950 }    # 1000/day, 8K TPM
    mistral/codestral-2508: { rpm: 110, tpm: 560000 }             # 125 RPM, 625K TPM
    mistral/ministral-14b-2512: { rpm: 27, tpm: 840000 }          # 30 RPM, 937K TPM
    # Gemini free tier: every Flash version has its own 5 RPM / 250K TPM / 20 RPD quota;
    # Flash-Lite 15 RPM / 250K TPM / 500 RPD. 20/day is why Flash is only a last resort.
    gemini/gemini-3.5-flash: { rpm: 4, tpm: 225000, rpd: 18 }
    gemini/gemini-2.5-flash: { rpm: 4, tpm: 225000, rpd: 18 }
    gemini/gemini-3.5-flash-lite: { rpm: 13, tpm: 225000, rpd: 450 }
    # NVIDIA NIM meters the whole account (see providers.nvidia_nim), not each model.

  # Provider-wide limits (shared by all of a provider's models), concurrency, and the
  # time zone in which daily quotas reset.
  providers:
    nvidia_nim: { rpm: 35, max_concurrency: 3 }  # ~40 RPM for the whole account
    gemini: { rpm: null, max_concurrency: 2, quota_timezone: America/Los_Angeles }
    mistral: { rpm: null, max_concurrency: 2 }
    groq: { rpm: null, max_concurrency: 2 }
    openrouter: { rpm: 15, max_concurrency: 1 }

  # Checked 2026-09-23 and NOT usable on the free plans of this account:
  #   Mistral: devstral-*, mistral-small/medium/large, magistral-* (0 RPM quota or tier-locked)
  #   Cerebras: gpt-oss-120b, qwen-3.8-27b ("payment required"); older models archived
  #   Gemini 3.7 / 3.8 Flash and the gemini-flash-latest alias: frequent 503 "high demand"
  #   (and each 503 retry still counts against that version's 20/day quota)
  max_queue_wait_s: 15   # longer expected wait -> try the next model instead
  temperature: 0.2
  timeout_s: 120
  retries: 3
  backoff_base_s: 1.0
  backoff_max_s: 30.0
  circuit_breaker:
    failure_threshold: 3
    cooldown_s: 120
  cache:
    enabled: true
    path: .autocover/llm_cache.sqlite
  usage_path: .autocover/usage.sqlite

sandbox:
  backend: docker        # docker | local (local = subprocess, for development only)
  python_version: "3.12"
  timeout_s: 120
  memory: 1g
  cpus: 1.0
  pids_limit: 256
  max_parallel: 4
  workdir: null          # scratch dir for workspaces; null = system temp dir

mutation:
  max_mutants_per_function: 8
  seed: 0

telemetry:
  jsonl_path: .autocover/telemetry.jsonl
  otlp_endpoint: null    # or set OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://localhost:4318
