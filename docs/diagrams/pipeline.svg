<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img">
<title>AutoCover-Lite agent pipeline</title>
<desc>Preparer, Generator, Executor and Validator run in sequence. The Validator sends tests to repair to the Fixer, whose output goes back to the Executor. Plan next round either starts another round at the Generator or goes to Finalize.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr, .head { fill: none; stroke: #888780; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .llm rect, rect.llm { fill: #EEEDFE; stroke: #534AB7; }
  .llm .th { fill: #3C3489; } .llm .ts { fill: #534AB7; }
  .box rect, rect.box { fill: #E1F5EE; stroke: #0F6E56; }
  .box .th { fill: #085041; } .box .ts { fill: #0F6E56; }
  .book rect, rect.book { fill: #F1EFE8; stroke: #5F5E5A; }
  .book .th { fill: #444441; } .book .ts { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .ts { fill: #D3D1C7; }
    .arr, .head { stroke: #B4B2A9; }
    .llm rect, rect.llm { fill: #3C3489; stroke: #AFA9EC; }
    .llm .th { fill: #EEEDFE; } .llm .ts { fill: #CECBF6; }
    .box rect, rect.box { fill: #085041; stroke: #5DCAA5; }
    .box .th { fill: #E1F5EE; } .box .ts { fill: #9FE1CB; }
    .book rect, rect.book { fill: #444441; stroke: #B4B2A9; }
    .book .th { fill: #F1EFE8; } .book .ts { fill: #D3D1C7; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>
<g class="llm"><rect x="60" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="58" text-anchor="middle" dominant-baseline="central">Preparer</text><text class="ts" x="190" y="78" text-anchor="middle" dominant-baseline="central">Baseline run, plan scenarios</text></g>
<line x1="190" y1="96" x2="190" y2="144" class="arr" marker-end="url(#arrow)"/>
<g class="llm"><rect x="60" y="146" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="164" text-anchor="middle" dominant-baseline="central">Generator</text><text class="ts" x="190" y="184" text-anchor="middle" dominant-baseline="central">One LLM call per function</text></g>
<line x1="190" y1="202" x2="190" y2="250" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="60" y="252" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="270" text-anchor="middle" dominant-baseline="central">Executor</text><text class="ts" x="190" y="290" text-anchor="middle" dominant-baseline="central">Batched pytest in Docker</text></g>
<line x1="190" y1="308" x2="190" y2="356" class="arr" marker-end="url(#arrow)"/>
<g class="llm"><rect x="60" y="358" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="376" text-anchor="middle" dominant-baseline="central">Validator</text><text class="ts" x="190" y="396" text-anchor="middle" dominant-baseline="central">Rules, mutants, accept, judge</text></g>
<line x1="320" y1="386" x2="418" y2="386" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="369" y="374" text-anchor="middle">repairs</text>
<g class="llm"><rect x="420" y="358" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="376" text-anchor="middle" dominant-baseline="central">Fixer</text><text class="ts" x="530" y="396" text-anchor="middle" dominant-baseline="central">Repairs failed or weak tests</text></g>
<path d="M530 358 L530 280 L322 280" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="426" y="270" text-anchor="middle">re-run</text>
<line x1="190" y1="414" x2="190" y2="482" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="204" y="452" text-anchor="start">no repairs, or no time</text>
<g class="book"><rect x="60" y="484" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="502" text-anchor="middle" dominant-baseline="central">Plan next round</text><text class="ts" x="190" y="522" text-anchor="middle" dominant-baseline="central">Rank functions with gaps</text></g>
<path d="M320 512 L656 512 L656 174 L322 174" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="500" text-anchor="middle">gaps left, round fits</text>
<line x1="190" y1="540" x2="190" y2="588" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="204" y="568" text-anchor="start">no gaps, or no time</text>
<g class="box"><rect x="60" y="590" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="608" text-anchor="middle" dominant-baseline="central">Finalize</text><text class="ts" x="190" y="628" text-anchor="middle" dominant-baseline="central">Suite check, mutation score</text></g>
<rect x="60" y="676" width="14" height="14" rx="3" class="llm" stroke-width="0.5"/><text class="ts" x="82" y="683" dominant-baseline="central">calls an LLM</text>
<rect x="210" y="676" width="14" height="14" rx="3" class="box" stroke-width="0.5"/><text class="ts" x="232" y="683" dominant-baseline="central">sandbox only</text>
<rect x="360" y="676" width="14" height="14" rx="3" class="book" stroke-width="0.5"/><text class="ts" x="382" y="683" dominant-baseline="central">bookkeeping</text>
</svg>
