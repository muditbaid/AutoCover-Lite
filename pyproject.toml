[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocover-lite"
version = "0.1.0"
description = "Multi-agent Python test generator with coverage, scenario and mutation quality gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mudit Baid" }]
keywords = ["testing", "pytest", "llm", "agents", "mutation-testing", "coverage", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "docker>=7.1",
    "libcst>=1.4",
    "coverage>=7.5",
    "pytest>=8",
    "tzdata>=2024.1",  # IANA time zones for quota resets (Windows has none built in)
    "ruff>=0.5",       # finalize removes unused imports / sorts imports in the merged suite
    "langgraph>=0.2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.urls]
Homepage = "https://github.com/muditbaid/AutoCover-Lite"
Source = "https://github.com/muditbaid/AutoCover-Lite"
Issues = "https://github.com/muditbaid/AutoCover-Lite/issues"

[project.optional-dependencies]
dev = []

[project.scripts]
autocover = "autocover.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autocover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker engine (skipped automatically when unavailable)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
