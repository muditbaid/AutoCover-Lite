name: AutoCover-Lite
description: >-
  Generate pytest tests for the Python modules a pull request changes, with a multi-agent
  pipeline (coverage, mutation-testing and rule gates), and open a PR with the tests.
branding:
  icon: check-circle
  color: blue

inputs:
  base:
    description: "Base ref to diff against (default: the pull request's base branch)."
    required: false
    default: ""
  paths:
    description: Space-separated modules to test instead of the changed ones.
    required: false
    default: ""
  budget-min:
    description: Wall-clock budget per module, in minutes.
    required: false
    default: "10"
  max-llm-calls:
    description: LLM call budget per module.
    required: false
    default: "60"
  max-modules:
    description: Test at most this many changed modules.
    required: false
    default: "5"
  create-pr:
    description: Open a pull request with the generated tests.
    required: false
    default: "true"
  config:
    description: "Path to a config.yaml (default: the one bundled with the action)."
    required: false
    default: ""

outputs:
  tests-written:
    description: Number of tests written across all modules.
    value: ${{ steps.summary.outputs.tests }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install AutoCover-Lite
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"

    - name: Pick modules
      id: modules
      shell: bash
      run: |
        if [ -n "${{ inputs.paths }}" ]; then
          modules="${{ inputs.paths }}"
        else
          base="${{ inputs.base }}"
          [ -z "$base" ] && base="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --no-tags --depth=200 origin "${base#origin/}" >/dev/null 2>&1 || true
          modules=$(autocover changed --base "$base" | head -n "${{ inputs.max-modules }}" | tr '\n' ' ')
        fi
        echo "modules=$modules" >> "$GITHUB_OUTPUT"
        echo "Modules: ${modules:-none}"

    - name: Generate tests
      if: steps.modules.outputs.modules != ''
      shell: bash
      env:
        AUTOCOVER_CONFIG: ${{ inputs.config || format('{0}/config.yaml', github.action_path) }}
      run: |
        mkdir -p .autocover/ci
        for module in ${{ steps.modules.outputs.modules }}; do
          name=$(echo "$module" | tr '/.' '__')
          autocover run . "$module" --config "$AUTOCOVER_CONFIG" \
            --budget-min "${{ inputs.budget-min }}" \
            --max-llm-calls "${{ inputs.max-llm-calls }}" \
            --json-out ".autocover/ci/$name.json" \
          || echo "{\"target\": \"$module\", \"error\": \"run failed, see log\"}" > ".autocover/ci/$name.json"
        done

    - name: Summarize
      id: summary
      shell: bash
      run: |
        mkdir -p .autocover/ci
        autocover ci-summary .autocover/ci > .autocover/summary.md
        cat .autocover/summary.md >> "$GITHUB_STEP_SUMMARY"
        tests=$(python -c "import json,glob; print(sum(json.load(open(f)).get('tests_in_suite', 0) for f in glob.glob('.autocover/ci/*.json')))")
        echo "tests=$tests" >> "$GITHUB_OUTPUT"

    - name: Open a pull request with the tests
      if: inputs.create-pr == 'true' && steps.summary.outputs.tests != '0'
      uses: peter-evans/create-pull-request@v6
      with:
        branch: autocover/${{ github.head_ref || github.ref_name }}
        base: ${{ github.head_ref || github.ref_name }}
        add-paths: tests/*_autocover.py
        commit-message: "Add tests generated by AutoCover-Lite"
        title: "AutoCover-Lite: tests for ${{ github.head_ref || github.ref_name }}"
        body-path: .autocover/summary.md
