# Copy to .github/workflows/autocover.yml in the repository you want tests for, and add
# your free-tier API keys as repository secrets (Settings -> Secrets -> Actions). Also
# enable Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
# requests", or the follow-up pull request cannot be opened. To run only on demand, see
# this repository's own .github/workflows/autocover.yml (label or manual trigger).
name: AutoCover-Lite

on:
  pull_request:
    paths: ["**.py"]

permissions:
  contents: write        # push the branch with generated tests
  pull-requests: write   # open the follow-up pull request

jobs:
  tests:
    runs-on: ubuntu-latest   # GitHub-hosted runners include Docker for the sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}   # the branch itself, not the merge commit
          fetch-depth: 0
      - uses: muditbaid/AutoCover-Lite@{{AUTOCOVER_VERSION}}   # `autocover init` fills in its own version
        with:
          budget-min: "10"
          max-modules: "3"
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
